<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>Checklist · Xina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#B01E28; --red-deep:#7E1419; --gold:#C99A3B; --gold-lt:#E3C878;
    --ink:#1A0E0C; --paper:#FBF6EC; --cream:#F4EADA; --mute:#8B7D72;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{color-scheme:light;background:#FBF6EC}
  body{
    font-family:'Noto Serif SC',Georgia,serif;background:#FBF6EC;color:#1A0E0C;
    line-height:1.6;padding-bottom:5rem;-webkit-text-size-adjust:100%;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 1.1rem}

  /* ---- HEADER ---- */
  header{
    background:linear-gradient(165deg,#2A0B0C,var(--red-deep) 70%,var(--red));
    color:var(--paper);padding:2rem 0 1.4rem;position:relative;overflow:hidden;
    border-bottom:3px solid var(--gold);
  }
  header .glyph{
    position:absolute;right:-1rem;top:-1.5rem;font-family:'Ma Shan Zheng',cursive;
    font-size:8rem;color:rgba(227,200,120,.13);line-height:1;pointer-events:none;
  }
  header .back{
    display:inline-block;position:relative;color:var(--gold-lt);text-decoration:none;
    font-size:.82rem;margin-bottom:.6rem;border-bottom:1px solid rgba(227,200,120,.4);
  }
  header .back:hover{color:var(--paper);border-bottom-color:var(--paper)}
  header h1{font-size:1.5rem;font-weight:900;letter-spacing:.02em;position:relative}
  header .sub{color:var(--gold-lt);font-size:.9rem;margin-top:.15rem;position:relative}
  .countdown{
    display:flex;align-items:baseline;gap:.5rem;margin-top:1rem;position:relative;
  }
  .countdown .n{font-family:'Ma Shan Zheng',cursive;font-size:3.2rem;color:var(--gold-lt);line-height:.9}
  .countdown .lbl{font-size:.85rem;opacity:.9}

  /* progress */
  .prog-wrap{margin-top:1.1rem;position:relative}
  .prog-bar{height:8px;background:rgba(255,255,255,.16);border-radius:4px;overflow:hidden}
  .prog-bar i{display:block;height:100%;width:0;background:var(--gold);
    border-radius:4px;transition:width .45s cubic-bezier(.4,0,.2,1)}
  .prog-txt{font-size:.78rem;color:var(--gold-lt);margin-top:.4rem}

  /* ---- SECTIONS ---- */
  section{margin-top:1.8rem}
  .sec-head{
    display:flex;align-items:center;gap:.55rem;padding-bottom:.4rem;
    border-bottom:2px solid var(--gold);margin-bottom:.2rem;
  }
  .sec-head h2{font-size:1.05rem;font-weight:900;color:#1A0E0C}
  .sec-head .cn{font-family:'Ma Shan Zheng',cursive;color:var(--gold);font-size:1.15rem}
  .sec-head .count{margin-left:auto;font-size:.78rem;color:#6E6058;font-variant-numeric:tabular-nums}
  .sec-note{font-size:.82rem;color:#6E6058;margin:.45rem 0 .1rem}

  /* ---- ITEMS ---- */
  label.item{color:#1A0E0C;
    display:flex;gap:.75rem;align-items:flex-start;padding:.72rem .2rem;
    border-bottom:1px solid rgba(201,154,59,.22);cursor:pointer;
  }
  label.item:last-of-type{border-bottom:none}
  label.item input{position:absolute;opacity:0;width:0;height:0}
  .box{
    flex-shrink:0;width:23px;height:23px;border:2px solid #C99A3B;background:#fff;border-radius:3px;
    margin-top:.12rem;display:grid;place-items:center;transition:background .15s,border-color .15s;
  }
  .box svg{width:14px;height:14px;stroke:var(--paper);stroke-width:3.2;fill:none;
    stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .2s ease}
  .txt{display:block}
  .txt .t{display:block;font-size:.96rem;font-weight:600;color:#1A0E0C;transition:opacity .2s}
  .txt .d{display:block;font-size:.82rem;color:#6E6058;margin-top:.15rem;line-height:1.45}
  input:checked ~ .box{background:var(--red);border-color:var(--red)}
  input:checked ~ .box svg{stroke-dashoffset:0}
  input:checked ~ .txt .t{text-decoration:line-through;opacity:.42}
  input:checked ~ .txt .d{opacity:.42}
  input:focus-visible ~ .box{outline:3px solid var(--gold);outline-offset:2px}

  /* urgent flag */
  .item.hot .box{border-color:var(--red)}
  .flag{
    display:inline-block;background:var(--red);color:#fff;font-size:.62rem;font-weight:900;
    padding:.08rem .38rem;border-radius:2px;margin-left:.4rem;vertical-align:.1em;
    letter-spacing:.04em;
  }

  /* reset */
  .reset{
    display:block;margin:2.5rem auto 0;background:none;border:1px solid rgba(139,125,114,.4);
    color:var(--mute);font-family:inherit;font-size:.8rem;padding:.5rem 1.1rem;
    border-radius:3px;cursor:pointer;
  }
  .reset:hover{border-color:var(--red);color:var(--red)}

  .saving{
    position:fixed;bottom:1rem;left:50%;transform:translateX(-50%) translateY(4rem);
    background:var(--ink);color:var(--paper);font-size:.78rem;padding:.45rem 1rem;
    border-radius:20px;transition:transform .3s;z-index:20;
  }
  .saving.show{transform:translateX(-50%) translateY(0)}

  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="glyph">行</div>
  <div class="wrap">
    <a class="back" href="index.html">← Tornar al viatge</a>
    <h1>Preparatius Xina</h1>
    <div class="sub">Vol BCN → Pequín · 4 set, 21:25</div>
    <div class="countdown"><span class="n" id="days">–</span><span class="lbl" id="dlbl">dies per sortir</span></div>
    <div class="prog-wrap">
      <div class="prog-bar"><i id="pbar"></i></div>
      <div class="prog-txt" id="ptxt">Carregant…</div>
    </div>
  </div>
</header>

<div class="wrap" id="app"></div>

<div class="saving" id="toast">Guardat</div>

<script>
const DATA = [
  {
    id:"urgent", cn:"急", title:"Ara mateix", 
    note:"Coses que no poden esperar: o es fan avui, o ja no arriben.",
    items:[
      {id:"u1", t:"Comprar els dos trens bala", d:"Chengdu→Chongqing (14) i Chongqing→Zhangjiajie (16). A Trip.com. El de Zhangjiajie s'omple.", hot:1},
      {id:"u2", t:"Configurar i verificar Alipay", d:"La verificació amb passaport triga fins a 24h. Fes-ho amb la línia espanyola per rebre l'SMS.", hot:1},
      {id:"u3", t:"Comprar i instal·lar l'eSIM Holafly", d:"Instal·la-la AQUÍ. A la Xina no es pot instal·lar i tu no tens ranura física.", hot:1},
      {id:"u4", t:"Omplir l'E-Arrival Card", d:"s.nia.gov.cn · gratis · 48-72h abans d'arribar. Cal passaport, vol i adreça del 1r hotel.", hot:1},
      {id:"u5", t:"Contractar l'assegurança", d:"IATI o Heymondo, amb cobertura de cancel·lació."},
      {id:"u6", t:"Restringir la carpeta de Drive", d:"Ara els passaports són accessibles amb l'enllaç. Posa-la en mode restringit."}
    ]
  },
  {
    id:"apps", cn:"应用", title:"Al mòbil, abans de volar",
    note:"A la Xina no es poden descarregar: Google Play està bloquejat i l'App Store va lentíssima.",
    items:[
      {id:"a1", t:"Baidu Translate", d:"El traductor principal. Càmera per a menús, sense VPN."},
      {id:"a2", t:"Pleco", d:"Diccionari de caràcters, funciona offline."},
      {id:"a3", t:"DiDi", d:"L'Uber xinès. Imprescindible a Zhangjiajie."},
      {id:"a4", t:"Dianping", d:"Per triar restaurant com els locals."},
      {id:"a5", t:"WeChat + Trip.com", d:"Missatgeria i reserves. Tots dos porten traductor integrat."},
      {id:"a6", t:"AMap amb mapes offline", d:"Descarrega les 5 ciutats. Interfície en xinès."},
      {id:"a7", t:"Google Maps offline", d:"De reserva i en espanyol."},
      {id:"a8", t:"VPN de la mare instal·lada i provada", d:"NO LetsVPN: tanca a la Xina el 2026. Fes servir Astrill (la més fiable) o ZoogVPN. Instal·la-la aquí: allà les webs de VPN estan bloquejades.", hot:1},
      {id:"a9", t:"Explicar-li que apagui la VPN per pagar", d:"Amb la VPN activa fallen Alipay, WeChat Pay i DiDi."}
    ]
  },
  {
    id:"docs", cn:"证件", title:"Documents",
    items:[
      {id:"d1", t:"Passaports dels 4"},
      {id:"d2", t:"Còpies en paper dels passaports", d:"Per separat de les originals."},
      {id:"d3", t:"Confirmacions d'hotels i vols impreses", d:"Per si el mòbil falla."},
      {id:"d4", t:"Targeta sense gluten en xinès", d:"celiactravel.com, gratis. Per al germà.", hot:1},
      {id:"d5", t:"Adreces dels hotels en xinès", d:"Per ensenyar al taxi. Els noms en anglès no els reconeixen."}
    ]
  },
  {
    id:"diners", cn:"钱", title:"Diners",
    items:[
      {id:"m1", t:"200-300 iuans en efectiu per persona", d:"Per als dipòsits de check-in d'alguns hotels."},
      {id:"m2", t:"Targetes Trade Republic i N26", d:"Les dues, per si Alipay no accepta una."},
      {id:"m3", t:"Avisar el banc del viatge", d:"Perquè no bloquegin les targetes per ús a l'estranger."}
    ]
  },
  {
    id:"tech", cn:"电子", title:"Tecnologia",
    items:[
      {id:"t1", t:"Adaptador d'endolls tipus A/I", d:"Amb ports USB, millor un per parella."},
      {id:"t2", t:"Bateria externa", d:"Clau: amb Alipay i mapes el mòbil s'esgota a mitja tarda.", hot:1},
      {id:"t3", t:"Cables de càrrega"},
      {id:"t4", t:"Auriculars"},
      {id:"t5", t:"Càrregador ràpid"}
    ]
  },
  {
    id:"roba", cn:"衣服", title:"Roba",
    note:"Setembre: Pequín 18-26°C i sec. El sud, més humit. Zhangjiajie refresca a la muntanya.",
    items:[
      {id:"r1", t:"Samarretes i roba lleugera", d:"Per capes, que hi ha salt tèrmic entre nord i sud."},
      {id:"r2", t:"Una peça de màniga llarga", d:"Per als matins a Zhangjiajie i l'aire condicionat."},
      {id:"r3", t:"Jaqueta fina o impermeable", d:"Al sud pot ploure."},
      {id:"r4", t:"Pantalons llargs", d:"Per als temples cal anar cobert."},
      {id:"r5", t:"Sabatilles còmodes de debò", d:"Un dia sencer caminant a Zhangjiajie i un altre a la Muralla.", hot:1},
      {id:"r6", t:"Xancletes per a l'hotel"},
      {id:"r7", t:"Roba interior i mitjons", d:"Els hotels solen tenir bugaderia."},
      {id:"r8", t:"Alguna cosa per sortir de nit", d:"TAG i altres clubs tenen codi de vestimenta: res d'esportiu."}
    ]
  },
  {
    id:"aseo", cn:"洗漱", title:"Higiene",
    items:[
      {id:"h1", t:"Raspall i pasta de dents"},
      {id:"h2", t:"Desodorant", d:"A la Xina costa de trobar-ne del que fem servir aquí."},
      {id:"h3", t:"Gel i xampú de viatge", d:"Els hotels en donen, però de qualitat variable."},
      {id:"h4", t:"Crema solar", d:"Setembre encara pica, i a la muntanya més."},
      {id:"h5", t:"Maquineta d'afaitar"},
      {id:"h6", t:"Tovalloletes i gel de mans", d:"Molts lavabos públics no tenen sabó ni paper."},
      {id:"h7", t:"Paquet de mocadors de butxaca", d:"Mateix motiu. Porteu-ne sempre."}
    ]
  },
  {
    id:"farmacia", cn:"药", title:"Farmaciola",
    items:[
      {id:"f1", t:"Antidiarreics", d:"El canvi de dieta i el picant passen factura."},
      {id:"f2", t:"Protector d'estómac", d:"La cuina sichuanesa és intensa."},
      {id:"f3", t:"Analgèsics"},
      {id:"f4", t:"Tiretes", d:"Per a les caminades."},
      {id:"f5", t:"Medicació habitual de cadascú", d:"Amb recepta si és necessari."},
      {id:"f6", t:"Snacks sense gluten de reserva", d:"Per als dies que el germà no trobi res segur.", hot:1}
    ]
  },
  {
    id:"maletes", cn:"行李", title:"Mides de l'equipatge",
    note:"Confirmat a les vostres reserves. Mana sempre la més restrictiva.",
    items:[
      {id:"b1", t:"Facturada: 24 polzades, 20 kg", d:"65×40×25 cm. Compleix el límit del tren (130 cm sumant les 3 mides)."},
      {id:"b2", t:"Cabina: 20×30×40 cm i 7 kg", d:"És la del vol de Pequín, la més estricta dels dos.", hot:1},
      {id:"b3", t:"Pesar les maletes abans de sortir", d:"A la Xina pesen l'equipatge de mà de debò."}
    ]
  }
];

const app = document.getElementById('app');
const KEY = 'xina-checklist-v1';
let state = {};

function icon(){return '<svg viewBox="0 0 24 24"><polyline points="4,12 10,18 20,6"/></svg>'}

function render(){
  app.innerHTML = DATA.map(sec=>`
    <section>
      <div class="sec-head">
        <span class="cn">${sec.cn}</span>
        <h2>${sec.title}</h2>
        <span class="count" id="c-${sec.id}"></span>
      </div>
      ${sec.note?`<p class="sec-note">${sec.note}</p>`:''}
      ${sec.items.map(it=>`
        <label class="item${it.hot?' hot':''}">
          <input type="checkbox" data-id="${it.id}" ${state[it.id]?'checked':''}>
          <span class="box">${icon()}</span>
          <span class="txt">
            <span class="t">${it.t}${it.hot?'<span class="flag">CLAU</span>':''}</span>
            ${it.d?`<span class="d">${it.d}</span>`:''}
          </span>
        </label>`).join('')}
    </section>`).join('') +
    `<button class="reset" id="reset">Desmarcar-ho tot</button>`;

  app.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change',e=>{
      state[e.target.dataset.id] = e.target.checked;
      save(); updateCounts();
    });
  });
  document.getElementById('reset').addEventListener('click',()=>{
    // Esborrar-ho tot no es pot desfer i la llista només viu en aquest
    // navegador: val més una pregunta que no pas tornar a marcar 52 coses.
    const done = DATA.reduce((n,sec)=>n+sec.items.filter(i=>state[i.id]).length,0);
    if(!done) return;
    const q = done===1
      ? 'Vols desmarcar l\'única cosa que tens marcada?'
      : 'Vols desmarcar les '+done+' coses que tens marcades?';
    if(!confirm(q+'\n\nNo es pot desfer.')) return;
    state={}; render(); save(); updateCounts();
  });
  updateCounts();
}

function updateCounts(){
  let total=0, done=0;
  DATA.forEach(sec=>{
    const d = sec.items.filter(i=>state[i.id]).length;
    total += sec.items.length; done += d;
    const el = document.getElementById('c-'+sec.id);
    if(el) el.textContent = d+'/'+sec.items.length;
  });
  const rst = document.getElementById('reset');
  if(rst) rst.style.visibility = done ? 'visible' : 'hidden';
  const pct = total? Math.round(done/total*100):0;
  document.getElementById('pbar').style.width = pct+'%';
  document.getElementById('ptxt').textContent =
    done===total ? 'Tot llest. Bon viatge!' : done+' de '+total+' fets · queden '+(total-done);
}

let toastT;
function toast(){
  const t=document.getElementById('toast');
  t.classList.add('show'); clearTimeout(toastT);
  toastT=setTimeout(()=>t.classList.remove('show'),1100);
}

function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); toast(); }
  catch(e){ /* navegació privada o sense espai: continua en memòria */ }
}

function load(){
  try{
    const r = localStorage.getItem(KEY);
    if(r) state = JSON.parse(r);
  }catch(e){ state={}; }
  render();
}

// countdown
(function(){
  const dep = new Date('2026-09-04T21:25:00+02:00');
  const diff = Math.ceil((dep - new Date())/86400000);
  const n=document.getElementById('days'), l=document.getElementById('dlbl');
  if(diff>1){ n.textContent=diff; l.textContent='dies per sortir'; }
  else if(diff===1){ n.textContent='1'; l.textContent='dia per sortir'; }
  else if(diff===0){ n.textContent='avui'; l.textContent='surt el vol'; }
  else { n.textContent='✈'; l.textContent='bon viatge'; }
})();

load();
</script>
</body>
</html>
